<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website - Andrean</title>

<style>
    body {
        margin: 0; padding: 0;
        font-family: Arial, sans-serif;

        /* Background image + gradient overlay */
        background:
            linear-gradient(to bottom, rgba(6, 11, 41, 0.85), rgba(20, 42, 133, 0.75)),
            url("https://th.bing.com/th/id/OIP.gM8pAqwLZTQ1VykZtyzlnAHaEK");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: white;
    }

    /* MAIN WRAPPER */
    .main-wrapper {
        width: 850px;
        margin: 40px auto;
        background: rgba(255,255,255,0.05);
        border: 2px solid white;
        border-radius: 18px;
        padding: 30px;
        position: relative;
    }

    /* SOCIAL ICONS TOP RIGHT (inside container) */
    /* social column placed to the right of the profile */
    .social-column{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
    .social-label{font-size:12px;opacity:0.85;text-transform:uppercase;letter-spacing:0.6px;font-weight:700}
    .social-top{display:flex;gap:10px}
    .social-top img{width:22px;cursor:pointer;opacity:0.9;transition:transform .16s,opacity .16s}
    .social-top img:hover{opacity:1;transform:scale(1.08)}

    /* PROFILE */
    .profile-wrapper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 10px;
    }

    .profile-pic {
        width: 80px; height: 80px;
        border-radius: 12px;
        object-fit: cover;
        border: 2px solid white;
    }

    .profile-text {
        font-size: 13px;
        line-height: 1.3;
    }
    .profile-text .name {
        font-weight: bold;
        font-size: 16px;
    }

    /* REPO LIST */
    .repo-list {
        margin-top: 35px;
    }

    /* Responsive: stack profile and social on smaller screens */
    @media (max-width:700px){
        .main-wrapper{width:95%;margin:20px auto;padding:20px}
        .profile-wrapper{flex-direction:column;align-items:flex-start;gap:12px}
        .social-column{align-items:flex-start}
        .social-top img{width:18px}
    }

    .repo-item {
        border: 2px solid white;
        padding: 14px 20px;
        margin-bottom: 15px;
        border-radius: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255,255,255,0.05);
    }

    .repo-buttons {
        display: flex;
        gap: 8px;
    }

    .repo-buttons button {
        border: 2px solid white;
        background: none;
        color: white;
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
    }

    .repo-buttons button:disabled {
        opacity: .3;
        cursor: not-allowed;
    }
</style>

</head>
<body>

<div class="main-wrapper">

    <!-- (moved) social icons are now displayed inline with the profile -->

    <!-- PROFILE -->
    <div class="profile-wrapper">
        <div style="display:flex; gap:20px; align-items:center;">
            <img src="https://media.tenor.com/7mSj4FRRZP0AAAAM/kiyotaka-ayanokoji-eyes.gif" class="profile-pic">

            <div class="profile-text">
                <div class="name">andrejonatan</div>
                Software Engineer & Network Engineer <br>
                Informatics student • Cybersecurity, Frontend, Networking <br>
                18 years old, still learning and building experience
            </div>
        </div>

        <!-- social column aligned to the right of the profile -->
        <div class="social-column">
            <div class="social-label">my social media</div>
            <div class="social-top">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" onclick="openSocial('github')" alt="github">
                <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" onclick="openSocial('email')" alt="email">
                <img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" onclick="openSocial('linkedin')" alt="linkedin">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" onclick="openSocial('instagram')" alt="instagram">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" onclick="openSocial('youtube')" alt="youtube">
            </div>
        </div>
    </div>

    <!-- AUTO GITHUB REPO LIST -->
    <div class="repo-list" id="repoList">
        <div style="text-align:center; opacity:0.7;">Loading repositories...</div>
    </div>

</div>

<script>
/* ========================
   FETCH GITHUB REPOS
======================== */

const GITHUB_USER = "andrejonatan";
const repoContainer = document.getElementById("repoList");

async function loadRepos() {
    const url = `https://api.github.com/users/${GITHUB_USER}/repos?sort=updated`;

    try {
        const res = await fetch(url);
        const repos = await res.json();

        repoContainer.innerHTML = "";

        repos.forEach(repo => {
            const homepageBtn = repo.homepage
                ? `<button onclick="window.open('${repo.homepage}', '_blank')">WEB</button>`
                : `<button disabled>WEB</button>`;

            repoContainer.innerHTML += `
                <div class="repo-item">
                    <div>${repo.name}</div>

                    <div class="repo-buttons">
                        <button onclick="window.open('${repo.html_url}', '_blank')">REPO</button>
                        ${homepageBtn}
                    </div>
                </div>
            `;
        });

    } catch (err) {
        repoContainer.innerHTML = "<div>Error loading repos.</div>";
    }
}

loadRepos();

/* ========================
   SOCIAL MEDIA LINKS
======================== */

const SOCIAL = {
    github: "https://github.com/andrejonatan",
    email: "mailto:jonatanandre01@gmail.com",
    linkedin: "https://linkedin.com/in/andrejonatan",
    instagram: "https://instagram.com/dresennn",
    youtube: "https://youtube.com/@ytandrean",
};

function openSocial(type) {
    if (!SOCIAL[type]) return;
    window.open(SOCIAL[type], "_blank");
}
</script>

</body>
</html>
